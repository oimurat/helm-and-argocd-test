apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: argocd-webhook-sensor
  namespace: argo-events
spec:
  eventBusName: default
  dependencies:
    - name: argocd-sync-failed-dep
      eventSourceName: argocd-webhook
      eventName: argocd-sync-failed

  triggers:
    - template:
        conditions: "argocd-sync-failed-dep"
        name: trigger-rollback-template
        argoWorkflow:
          group: argoproj.io
          version: v1alpha1
          resource: workflows
          operation: submit
          submitOptions:
            namespace: argo
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: rollback-workflow-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: rollback-workflow-template